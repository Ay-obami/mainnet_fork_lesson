[profile.default]
src = "src"
out = "out"
libs = ["lib"]

fs_permissions = [
    { access = "read", path = "./assets" }
]

# Free public archive endpoints occasionally drop requests (throttling /
# timeouts). If a run fails with EVM/database errors, retry with:
#   forge test --fork-retries 5 --fork-retry-backoff 1

# Persist fetched mainnet storage under cache/ so repeat runs at this block
# hit the network far less often.
[profile.default.rpc_storage_caching]
chains = "all"
forges = "tests"

# Named endpoints (usable via vm.rpcUrl("mainnet") / forge --rpc-url mainnet)
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
